[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API Proxy to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/admin-api/:splat"
  status = 200

# Client-Side SPA Rewrites
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
